[project]
name = "basecamp-mcp"
version = "0.1.0"
description = "Basecamp MCP Server - Connect Basecamp to Claude and other AI tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "You" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["basecamp_mcp"]

[tool.setuptools.package-data]
basecamp_mcp = ["py.typed"]
